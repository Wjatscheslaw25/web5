<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание №5 (Юрьев Вячеслав, ПИ-21-1)</title>
    
    <!-- Подключение Bootstrap 4 (по желанию, для красивого оформления) -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    
    <!-- Ваши стили -->
    <link rel="stylesheet" href="style.css">

    <!-- Подключение скрипта с атрибутом defer -->
    <script src="calculator.js" defer></script>
</head>
<body class="bg-light">

    <!-- ШАПКА САЙТА -->
    <header id="site-header" class="bg-dark text-white py-3 w-100">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <div id="logo-container" class="d-flex align-items-center mb-2 mb-md-0">
                <img id="logo" src="image.jpg" alt="Логотип" width="50" height="50" class="rounded-circle mr-3" style="object-fit: cover;" />
                <span id="site-title" class="font-weight-bold">Юрьев Вячеслав</span>
            </div>
            <nav id="top-nav">
                <span class="text-white">Задание №5</span>
            </nav>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="container my-5 bg-white p-4 shadow-sm rounded" style="max-width: 600px;">
        <h1 class="h3 mb-4 text-center">Калькулятор стоимости заказа</h1>

        <form id="calculator-form" novalidate>
<!-- Выбор товара -->
            <div class="form-group">
                <label for="product-select" class="font-weight-bold">Выберите товар:</label>
                <select id="product-select" class="form-control">
                    <option value="100000">Ноутбук — 100 000 руб.</option>
                    <option value="50000">Смартфон — 50 000 руб.</option>
                    <option value="15000">Наушники — 15 000 руб.</option>
                </select>
            </div>

            <!-- Ввод количества -->
            <div class="form-group">
                <label for="quantity-input" class="font-weight-bold">Количество товара:</label>
                <input type="text" id="quantity-input" class="form-control" placeholder="Введите количество (например, 2)" value="1">
                <div id="error-message" class="text-danger mt-1 small d-none">
                    Пожалуйста, введите корректное положительное целое число!
                </div>
            </div>

            <!-- Кнопка расчета -->
            <button type="button" id="calc-button" class="btn btn-primary btn-block mt-4">
                Рассчитать стоимость
            </button>
        </form>

        <!-- Блок вывода результата -->
        <div id="result-block" class="alert alert-info mt-4 mb-0 text-center font-weight-bold h5">
            Итоговая стоимость: <span id="result-value">100000</span> руб.
        </div>
    </main>

    <!-- ПОДВАЛ -->
    <footer id="site-footer" class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Юрьев Вячеслав</p>
    </footer>

</body>
</html>
